<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="theme-color" content="#16946B">
<meta name="description" content="Simple budget app: log spending in 5 seconds, see what's left.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* VOICE calm, friendly money app · IDEA a pocket wallet card · PICTURE one big "left to spend" number
   COLOUR white cards on soft grey, one green accent, amber/red only for warnings · TYPE system sans
   LAYOUT single phone column, bottom tab bar with a big + */
:root{--bg:#F4F5F7;--card:#FFFFFF;--ink:#16181D;--muted:#6B7280;--faint:#A1A7B3;--line:#ECEEF1;
  --green:#16946B;--green-bg:#E3F4EC;--amber:#B7791F;--amber-bg:#FDF3E1;--red:#D64545;--red-bg:#FCEBEB;
  --accent:#16946B;--chip:#F1F2F5;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05)}
:root[data-theme=dark]{--bg:#0F1115;--card:#181B21;--ink:#F2F3F5;--muted:#9AA1AD;--faint:#6B7280;--line:#262A31;
  --green:#3CC497;--green-bg:#16352B;--amber:#F2B65A;--amber-bg:#3A2E18;--red:#F07A7A;--red-bg:#3B1E1E;--accent:#3CC497;--chip:#232730;--shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#0F1115;--card:#181B21;--ink:#F2F3F5;--muted:#9AA1AD;--faint:#6B7280;--line:#262A31;
  --green:#3CC497;--green-bg:#16352B;--amber:#F2B65A;--amber-bg:#3A2E18;--red:#F07A7A;--red-bg:#3B1E1E;--accent:#3CC497;--chip:#232730;--shadow:none}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.month{display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px}
.arrow{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.arrow:active{background:var(--chip)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{text-align:center;padding:22px 18px 18px}
.label{font-size:13px;color:var(--muted)}
.big{font-size:clamp(36px,12vw,46px);font-weight:700;letter-spacing:-1px;line-height:1.15;margin:4px 0 2px}
.sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--chip);border-radius:14px;padding:10px 6px}
.stat b{display:block;font-size:16px;margin-top:2px;white-space:nowrap}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.alert.warn{background:var(--amber-bg);color:var(--amber)}.alert.bad{background:var(--red-bg);color:var(--red)}.alert.ok{background:var(--green-bg);color:var(--green)}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.line1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--chip);margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.bad{background:var(--red-bg);color:var(--red)}.pill.neutral{background:var(--chip);color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;text-align:center}
.nav-side{display:grid;grid-template-columns:1fr 1fr}
.tab{font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;justify-content:center}
.tab span{font-size:20px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--ink)}.tab.on span{filter:none;opacity:1}
.fab{width:60px;height:60px;border-radius:30px;background:var(--accent);color:#fff;font-size:32px;margin:-30px auto 0;box-shadow:0 6px 18px rgba(22,148,107,.35);display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;overflow-y:auto}
.sheet.open{display:flex}
.sheet-in{max-width:460px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:20px;background:var(--chip);font-size:18px}
.amount{text-align:center;font-size:52px;font-weight:700;letter-spacing:-1px;margin:12px 0 2px;white-space:nowrap}
.amount small{font-size:28px;color:var(--muted);font-weight:600;margin-right:2px}
.meta{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chipbtn{background:var(--chip);border-radius:20px;padding:8px 13px;font-size:13px;color:var(--muted);position:relative;overflow:hidden;min-height:36px}
.chipbtn input{position:absolute;inset:0;opacity:0;width:100%}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow-y:auto;max-height:32vh;padding:2px}
.cat{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow);border:2px solid transparent;overflow-wrap:anywhere}
.cat span{display:block;font-size:22px;margin-bottom:3px}
.cat.sel{border-color:var(--accent);color:var(--ink)}
.groups{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.g{background:var(--chip);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.g.on{background:var(--ink);color:var(--card)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto;padding-top:12px}
.key{background:var(--card);border-radius:14px;height:52px;font-size:22px;font-weight:500;box-shadow:var(--shadow)}
.key:active{transform:scale(.97)}
.save{margin-top:10px;height:54px;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;width:100%}
.save:disabled{opacity:.45}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px}
.note{width:100%;border:0;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink);margin-bottom:10px}
.day{font-size:12px;color:var(--muted);margin:14px 4px 6px;letter-spacing:.3px}
.del{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-size:14px;display:none;z-index:20;gap:14px;align-items:center;white-space:nowrap}
.toast.show{display:flex}
.toast button{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.btn{display:block;width:100%;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.amt-in{width:96px;text-align:right;border:0;border-radius:10px;background:var(--chip);padding:8px 10px;font-size:16px}
.name-in{width:100%;border:0;border-radius:10px;background:var(--chip);padding:8px 10px;font-size:16px}
.rm{width:32px;height:32px;border-radius:16px;color:var(--faint);font-size:16px;flex:none}
.add-row{color:var(--accent);font-size:14px;padding:10px 0 2px;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--chip);border-radius:12px;padding:10px 16px;font-size:16px;min-width:52px}
.seg button.on{background:var(--ink);color:var(--card)}
.status{font-size:12px;color:var(--faint);text-align:center;margin-top:10px}
.skel{height:110px;border-radius:20px;background:var(--card);margin-bottom:12px;opacity:.6}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.field{display:block;text-align:left;margin:0 0 14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.inp{width:100%;height:48px;border:0;border-radius:12px;background:var(--chip);padding:0 14px;font-size:16px;color:var(--ink)}
.inp.bigin{height:60px;font-size:28px;font-weight:700;text-align:center}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.mini{height:36px;border:0;border-radius:10px;background:var(--chip);padding:0 26px 0 10px;font-size:14px;color:var(--ink);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 15px,calc(100% - 8px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 18px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--accent);width:20px}
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin:10px auto 0;max-width:260px}
.kind button{height:36px;border-radius:10px;font-size:14px;color:var(--muted)}.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.chipbtn select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.chipbtn.on{background:var(--green-bg);color:var(--green)}
.newcat{display:none;gap:8px;margin:8px 0 0}.newcat.open{display:flex}
.payday{margin-top:12px;font-size:13px;color:var(--green);background:var(--green-bg);border-radius:12px;padding:8px 10px}
.inc-item{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left}
.grid52{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.tick{height:44px;border-radius:10px;background:var(--chip);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--green);color:#fff;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cal span{font-size:11px;color:var(--faint)}
.cal i{font-style:normal;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--chip);color:var(--muted)}
.cal i.ns{background:var(--green-bg);color:var(--green);font-weight:600}.cal i.sp{background:var(--chip)}.cal i.fut{opacity:.4}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--chip);margin:6px 0 2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kv div{background:var(--chip);border-radius:12px;padding:8px}.kv b{display:block;font-size:15px}
.gear{width:40px;height:40px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:18px}

.tipbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle;font-family:Georgia,serif;font-style:italic}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:30;display:none;align-items:flex-end;justify-content:center;padding:16px}
.overlay.open{display:flex}
.pop{background:var(--card);border-radius:22px;padding:20px;max-width:440px;width:100%;margin-bottom:calc(84px + env(safe-area-inset-bottom));box-shadow:0 10px 40px rgba(0,0,0,.25)}
.pop h3{font-size:17px;margin:0 0 6px}.pop p{margin:0 0 14px;color:var(--muted);font-size:15px}
.steps{font-size:12px;color:var(--faint);margin-bottom:6px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.allcats{margin-top:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.check:first-child{border-top:0}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check .nm{flex:1;min-width:0}
.check .amt-in{width:84px}
.check .mini{width:84px}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{flex:none}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.trend .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.trend .bars{display:flex;align-items:flex-end;gap:2px;height:104px;width:100%;justify-content:center}
.trend .bars i{width:42%;border-radius:4px 4px 0 0;display:block}
.trend small{font-size:10px;color:var(--faint)}
.mover{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mover:first-of-type{border-top:0}
.ytable{width:100%;border-collapse:collapse;font-size:13px}
.ytable th{color:var(--faint);font-weight:500;text-align:right;padding:6px 4px}
.ytable td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);white-space:nowrap}
.ytable td:first-child,.ytable th:first-child{text-align:left}
.summary p{margin:0 0 8px;font-size:15px}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px;padding:8px 0}
</style>
</head>
<body>
<div class="app" id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

<nav class="nav" id="nav" style="display:none"><div class="nav-in">
  <div class="nav-side"><button class="tab on" data-v="home"><span>🏠</span>Home</button><button class="tab" data-v="insights"><span>📊</span>Insights</button></div>
  <button class="fab" id="fab" aria-label="Add">+</button>
  <div class="nav-side"><button class="tab" data-v="plan"><span>🎯</span>Plan</button><button class="tab" data-v="goals"><span>🏆</span>Goals</button></div>
</div></nav>

<div class="sheet" id="sheet"><div class="sheet-in" style="padding-top:calc(14px + env(safe-area-inset-top))">
  <div class="sheet-top"><button class="x" id="close" aria-label="Close">✕</button><div class="kind" id="kind" style="margin:0"><button data-kind="out">Expense</button><button data-kind="in">Income</button></div><span style="width:40px"></span></div>
  <div class="amount" id="amount">0</div>
  <div class="meta">
    <label class="chipbtn">📅 <span id="dateLbl">Today</span><input type="date" id="date" aria-label="Date"></label>
    <label class="chipbtn" id="repChip">🔁 <span id="repLbl">Once</span><select id="rep" aria-label="Repeat"><option value="once">Once</option><option value="monthly">Every month</option><option value="twice">Twice a month</option><option value="biweekly">Every 2 weeks</option><option value="weekly">Every week</option></select></label>
    <button class="chipbtn" id="noteBtn">✏️ Note</button>
  </div>
  <input class="note" id="note" placeholder="Note (optional)" style="display:none" maxlength="60">
  <div class="quick" id="quick"></div>
  <select class="inp allcats" id="allcats" aria-label="All categories"></select>
  <div class="newcat" id="newcat"><input class="inp" id="newcatName" placeholder="New category name" maxlength="30"><button class="btn" style="width:90px;height:48px" id="newcatAdd">Add</button></div>
  <div class="err" id="err"></div>
  <div class="keys" id="keys"></div>
  <div style="display:flex;gap:8px"><button class="save" id="del" style="display:none;width:34%;background:var(--red-bg);color:var(--red)">Delete</button><button class="save" id="save">Save</button></div>
</div></div>

<div class="overlay" id="overlay"><div class="pop" id="pop"></div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">Undo</button></div>
<script>
{
/* ============================================================
   Budget app v3 — data stays on the device (localStorage)
   ============================================================ */
const FREQ = {once:'Once', monthly:'Every month', twice:'Twice a month', biweekly:'Every 2 weeks', weekly:'Every week'};
const PER_MONTH = {monthly:1, twice:2, biweekly:26/12, weekly:52/12, once:0};
const GROUP_ORDER = ['Income','Bills','Spending','Savings','Debt'];
const GROUP_LABEL = {Income:'Income', Bills:'Bills', Spending:'Everyday', Savings:'Savings', Debt:'Debt payments'};
/* suggestions shown in setup — the user picks, nothing is pre-filled with amounts */
const SUGGEST_BILLS = [['Rent','Bills'],['Mortgage','Bills'],['Electricity','Bills'],['Water','Bills'],['Gas / heating','Bills'],['Phone','Bills'],['Internet','Bills'],
  ['Insurance','Bills'],['Streaming','Bills'],['Music','Bills'],['Gym','Bills'],['Kindergarten / school','Bills'],['Car loan','Debt'],['Credit card','Debt'],['Student loan','Debt']];
const SUGGEST_SPEND = ['Groceries','Eating out','Transport','Shopping','Health','Kids','Pets','Fun','Personal care','Gifts','Other'];
const SUGGEST_SPEND_ON = ['Groceries','Eating out','Transport','Shopping','Other'];
const COMMON_INCOME = ['Side job','Freelance','Rental income','Bonus','Child benefit','Pension','Other income'];
const OWN='__own__';

/* ---------- storage ---------- */
const S = {plan:null, tx:[], running:false};
const LS_KEY='budget-app-v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null')||{plan:null,tx:[]}; }catch(e){ return {plan:null,tx:[]}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({plan:S.plan, tx:S.tx})); }catch(e){ toast('Storage is full on this phone', false); } }
function storePlan(){ lsSave(); }
function uid8(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function storeAdd(rec,id){
  id=id||('tx-'+uid8()); if(S.tx.some(x=>x.id===id)) return id;
  S.tx.push(Object.assign({id, k:'tx', ts:Date.now()}, rec)); lsSave(); return id;
}
function storeDel(id){
  const t=S.tx.find(x=>x.id===id); S.tx=S.tx.filter(x=>x.id!==id);
  if(t&&t.rid){ const r=rules().find(r=>r.id===t.rid); if(r) r.skip=(r.skip||[]).concat([t.date]); }
  lsSave();
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{ const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); };
const todayStr=()=>ds(new Date());
const ym=d=>d.slice(0,7);
const num=v=>Math.round((parseFloat(String(v||'').replace(',','.'))||0)*100)/100;
function daysIn(m){ const p=m.split('-'); return new Date(+p[0],+p[1],0).getDate(); }
function monthName(m,short){ const p=m.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleString('en-US',{month:short?'short':'long',year:'numeric'}); }
const monShort=m=>monthName(m,true).split(' ')[0];
function shiftMonth(m,n){ const p=m.split('-'); const d=new Date(+p[0],+p[1]-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function fmtDay(d,long){ return pd(d).toLocaleString('en-US',long?{weekday:'long',month:'short',day:'numeric'}:{month:'short',day:'numeric'}); }
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return ds(d); }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/864e5); }
function ord(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function cur(){ return (S.plan&&S.plan.currency)||ob.cur||'€'; }
function money(v,dec){ const n=Math.abs(v); const s=n.toLocaleString('en-US',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); return (v<0?'−':'')+cur()+s; }
const pct=v=>Math.round(v*100)+'%';

/* ---------- plan helpers ---------- */
const cats=()=>S.plan?S.plan.cats:[];
const catsOf=g=>cats().filter(c=>c.group===g&&c.name);
function catByName(n){ return cats().find(c=>c.name===n); }
function groupOf(n){ const c=catByName(n); return c?c.group:null; }
const rules=()=>(S.plan&&S.plan.rules)||[];
const ruleFor=n=>rules().find(r=>r.cat===n);
function spentIn(m,n){ let s=0; S.tx.forEach(t=>{ if(ym(t.date)===m&&t.cat===n) s+=t.amt; }); return s; }
function groupSum(m,g){ let s=0; S.tx.forEach(t=>{ if(ym(t.date)===m&&groupOf(t.cat)===g) s+=t.amt; }); return s; }
const planned=g=>cats().filter(c=>c.group===g).reduce((a,c)=>a+(+c.budget||0),0);
function syncIncomeBudget(n){ const r=ruleFor(n), c=catByName(n); if(r&&c&&c.group==='Income') c.budget=Math.round(r.amt*PER_MONTH[r.freq]); }

/* how much can be spent on everyday things this month */
function spendPool(){
  const inc=planned('Income');
  if(inc>0) return {pool:Math.max(0, inc-planned('Bills')-planned('Savings')-planned('Debt')), mode:'income'};
  return {pool:planned('Spending'), mode:'limits'};
}

/* ---------- repeating items ---------- */
function occurrences(r,until){
  const out=[], start=r.start; if(start>until) return out;
  if(r.freq==='weekly'||r.freq==='biweekly'){ const step=r.freq==='weekly'?7:14; for(let d=start; d<=until&&out.length<600; d=addDays(d,step)) out.push(d); }
  else { const d0=+start.slice(8,10); const days=r.freq==='twice'?(d0<=15?[d0,d0+15]:[d0-15,d0]):[d0];
    for(let m=ym(start); m<=ym(until)&&out.length<600; m=shiftMonth(m,1)) days.forEach(dd=>{ const x=m+'-'+pad(Math.min(dd,daysIn(m))); if(x>=start&&x<=until) out.push(x); }); }
  const skip=r.skip||[]; return out.filter(x=>skip.indexOf(x)<0);
}
function nextOcc(r,from){ return occurrences(Object.assign({},r,{skip:[]}), addDays(from,62)).find(x=>x>=from)||null; }
function runRules(){
  if(S.running||!S.plan) return 0; S.running=true; let n=0; const today=todayStr();
  rules().forEach(r=>occurrences(r,today).forEach(d=>{ const id='r-'+r.id+'-'+d; if(!S.tx.some(x=>x.id===id)){ storeAdd({date:d,cat:r.cat,amt:r.amt,note:r.note||'',rid:r.id,auto:true},id); n++; } }));
  S.running=false; return n;
}

function obRead(){

function obFinish(){
  const old=redoPlan, keep=!!old; redoPlan=null;   // "set up again" keeps entries
  const plan={currency:ob.cur, cats:[], rules:[], created:old?(old.created||todayStr()):todayStr(), method:old?(old.method||'own'):'own', challenges:old?(old.challenges||[]):[], tourDone:!!(old&&old.tourDone), lastBackup:old?old.lastBackup:null};
  const addRule=(cat,amt,freq,start)=>plan.rules.push({id:uid8(),cat,amt,freq,start,note:'',skip:[]});
  const m=ym(todayStr());
  if(!ob.noSalary&&num(ob.salary)>0){ plan.cats.push({name:'Salary',group:'Income',budget:Math.round(num(ob.salary)*PER_MONTH[ob.freq])}); addRule('Salary',num(ob.salary),ob.freq,ob.date); }
  ob.extras.forEach(x=>{ plan.cats.push({name:x.name,group:'Income',budget:Math.round(x.amt*(PER_MONTH[x.freq]||0))}); if(x.freq!=='once') addRule(x.name,x.amt,x.freq,x.date); });
  if(!plan.cats.some(c=>c.group==='Income')) plan.cats.push({name:'Salary',group:'Income',budget:0});
  const bills=SUGGEST_BILLS.filter(([n])=>ob.bills[n]&&ob.bills[n].on).map(([n,g])=>({name:n,group:g,amt:num(ob.bills[n].amt),day:+ob.bills[n].day||null})).concat(ob.ownBills.map(b=>({name:b.name,group:'Bills',amt:b.amt,day:b.day})));
  bills.forEach(b=>{ plan.cats.push({name:b.name,group:b.group,budget:b.amt,due:b.day});
    if(ob.autoBills&&b.amt>0&&b.day) addRule(b.name,b.amt,'monthly',m+'-'+pad(Math.min(b.day,daysIn(m)))); });
  SUGGEST_SPEND.filter(n=>ob.spend[n]&&ob.spend[n].on).concat(ob.ownSpend).forEach(n=>plan.cats.push({name:n,group:'Spending',budget:num((ob.spend[n]||{}).lim)}));
  if(!plan.cats.some(c=>c.group==='Spending')) plan.cats.push({name:'Other',group:'Spending',budget:0});
  if(num(ob.save)>0) plan.cats.push({name:'Savings',group:'Savings',budget:num(ob.save)});
  if(keep) old.cats.forEach(c=>{ if(!plan.cats.some(x=>x.name===c.name)&&S.tx.some(t=>t.cat===c.name)) plan.cats.push(c); });
  plan.cats.sort((a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group));
  if(!keep) S.tx=[];
  S.plan=plan;
  ob.extras.filter(x=>x.freq==='once').forEach(x=>storeAdd({date:x.date,cat:x.name,amt:x.amt,note:''}));
  /* bills already paid this month before setup? don't add them twice */
  plan.rules.forEach(r=>occurrences(r,todayStr()).forEach(d=>{ if(S.tx.some(t=>t.cat===r.cat&&ym(t.date)===ym(d)&&!t.auto)) r.skip.push(d); }));
  storePlan(); runRules(); view='home'; render();
  if(!plan.tourDone){ tourStep=0; showTour(); }
}

  const m=month, today=todayStr(), isCur=ym(today)===m, dim=daysIn(m);

  const sp=catsOf('Spending'); let spent=0; sp.forEach(c=>spent+=spentIn(m,c.name));
  const P=spendPool(), left=P.pool-spent;
  const income=groupSum(m,'Income'), out=groupSum(m,'Bills')+groupSum(m,'Spending')+groupSum(m,'Debt'), saved=groupSum(m,'Savings');
  let pay=null; rules().filter(r=>groupOf(r.cat)==='Income').forEach(r=>{ const n=nextOcc(r,addDays(today,1)); if(n&&(!pay||n<pay.d)) pay={d:n,r}; });

  if(P.mode==='income'&&isCur&&day>=5&&spent/day*dim>P.pool&&P.pool>0) alerts.push({cls:'warn',t:'At this pace you\'ll spend more than you have this month'});
  let h=monthBar();
  h+=`<div class="card hero"><div class="label">Left to spend ${tip('left')}</div>
    <div class="big" style="color:${left<0?'var(--red)':'var(--green)'}">${money(left)}</div>
    <div class="sub">${isCur?(left>0?money(left/daysLeft)+' a day '+tip('perday')+' · '+daysLeft+' days left':'Your spending money for this month is used up'):(m<ym(today)?'Month closed':'Month hasn\'t started')}</div>

  alerts.slice(0,2).forEach(a=>{ h+=`<div class="alert ${a.cls}"><span>${a.cls==='bad'?'⛔':'⚠️'}</span><span>${a.t}</span></div>`; });
  if(!alerts.length&&isCur&&spent>0) h+=`<div class="alert ok"><span>✓</span><span>Spending is on track</span></div>`;
  if(S.tx.length>=20&&(!S.plan.lastBackup||daysBetween(S.plan.lastBackup,today)>30)) h+=`<button class="alert warn" style="width:100%;text-align:left" data-v="more"><span>💾</span><span>Save a backup of your data — tap here</span></button>`;
  if(!S.tx.some(t=>!t.auto)) h+=`<div class="alert ok"><span>👋</span><span>Tap <b>+</b> below to log your first expense.</span></div>`;
  // spending
  h+=`<div class="card"><div class="line1"><h3>Everyday spending</h3><span class="right">${money(spent)}</span></div>`;
  sp.forEach(c=>{ const s=spentIn(m,c.name);
    if(c.budget){ const p=Math.min(s/c.budget,1), col=s>c.budget?'var(--red)':(p>=.8?'var(--amber)':'var(--green)');
      h+=`<div class="row"><div class="ico">${icon(c)}</div><div class="grow"><div class="line1"><span class="name">${esc(c.name)}</span><span class="right">${s>c.budget?`<span style="color:var(--red)">${money(s-c.budget)} over</span>`:money(c.budget-s)+' left'}</span></div><div class="bar"><i style="width:${p*100}%;background:${col}"></i></div></div></div>`; }
    else h+=`<div class="row"><div class="ico">${icon(c)}</div><div class="grow"><div class="line1"><span class="name">${esc(c.name)}</span><span class="right">${s?money(s)+' spent':'—'}</span></div></div></div>`; });
  h+=`</div>`;
  // bills

  if(bills.length){ h+=`<div class="card"><h3>Bills</h3>`;
    bills.slice().sort((a,b)=>(+a.due||99)-(+b.due||99)).forEach(c=>{
      const paid=spentIn(m,c.name)>0, due=+c.due||0, auto=!!ruleFor(c.name); let pill;
      if(paid) pill='<span class="pill ok">Paid</span>';
      else if(auto&&m>=ym(today)) pill=`<span class="pill neutral">🔁 ${due?monShort(m)+' '+due:'Auto'}</span>`;
      else if(m<ym(today)) pill='<span class="pill bad">Not logged</span>';
      else if(!due) pill='<span class="pill neutral">Unpaid</span>';
      else if(isCur&&day>due) pill='<span class="pill bad">Overdue</span>';
      else if(isCur&&due-day<=7) pill=`<span class="pill warn">${due===day?'today':'in '+(due-day)+' day'+(due-day===1?'':'s')}</span>`;
      else pill=`<span class="pill neutral">${monShort(m)} ${due}</span>`;
      h+=`<button class="row" style="width:100%;text-align:left" data-pay="${esc(c.name)}"><div class="ico">${icon(c)}</div><div class="grow"><div class="line1"><span class="name">${esc(c.name)}</span><span class="right">${c.budget?money(c.budget):''}</span></div></div>${pill}</button>`; });
    h+=`<p class="sub" style="margin:8px 0 0">Tap a bill to mark it paid. 🔁 = added automatically.</p></div>`; }
  // recent entries
  const recent=S.tx.filter(t=>ym(t.date)===m).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)).slice(0,5);
  if(recent.length){ h+=`<div class="card"><div class="line1"><h3>Latest</h3><button class="linkbtn" data-act="alltx">See all ›</button></div>`+recent.map(txRow).join('')+`</div>`; }

}
function txRow(t){ const g=groupOf(t.cat), isIn=g==='Income';
  return `<button class="row" style="width:100%;text-align:left" data-edit="${esc(t.id)}"><div class="ico">${icon({name:t.cat,group:g||''})}</div><div class="grow"><div class="name">${esc(t.cat)}${t.auto?' <span class="right">🔁</span>':''}</div><div class="right" style="text-align:left">${fmtDay(t.date)}${t.note?' · '+esc(t.note):''}</div></div><b style="color:${isIn?'var(--green)':'var(--ink)'};white-space:nowrap">${isIn?'+':''}${money(t.amt,2)}</b></button>`; }

/* ---------- INSIGHTS ---------- */
const PALETTE=['#16946B','#378ADD','#D4537E','#EF9F27','#7F77DD','#1D9E9E','#D85A30','#8A8F98'];
function outByCat(m){ const o={}; S.tx.forEach(t=>{ if(ym(t.date)!==m) return; const g=groupOf(t.cat); if(g==='Bills'||g==='Spending'||g==='Debt'||(!g&&t.cat)) o[t.cat]=(o[t.cat]||0)+t.amt; }); return o; }
function monthTotals(m){ const inc=groupSum(m,'Income'), out=groupSum(m,'Bills')+groupSum(m,'Spending')+groupSum(m,'Debt'); return {inc,out,kept:inc-out}; }
function donutSvg(parts,total){
  const R=54,C=2*Math.PI*R; let off=0;
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Spending by category"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--chip)" stroke-width="20"/>`+
    parts.map(p=>{ const len=total?p.v/total*C:0; const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off+=len; return s; }).join('')+
    `<text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--muted)">spent</text><text x="70" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${esc(money(total))}</text></svg>`;
}
function renderInsights(){
  const m=month, prev=shiftMonth(m,-1), T=monthTotals(m), TP=monthTotals(prev);
  const by=outByCat(m), byP=outByCat(prev), total=Object.values(by).reduce((a,b)=>a+b,0);
  const sorted=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const top=sorted.slice(0,7), rest=sorted.slice(7).reduce((a,x)=>a+x[1],0);
  const parts=top.map((x,i)=>({n:x[0],v:x[1],c:PALETTE[i]})); if(rest>0) parts.push({n:'Everything else',v:rest,c:PALETTE[7]});
  let h=monthBar();
  if(!S.tx.some(t=>ym(t.date)===m)){ $('app').innerHTML=h+`<div class="card empty">Nothing logged in ${monthName(m)} yet.<br>Your insights appear as soon as you add expenses.</div>`; return; }
  // summary
  const rate=T.inc>0?T.kept/T.inc:null;
  const sentences=[];
  if(sorted.length) sentences.push(`Most of your money went to <b>${esc(sorted[0][0])}</b> (${money(sorted[0][1])}${total?', '+pct(sorted[0][1]/total)+' of everything that went out':''}).`);
  if(TP.out>0){ const d=(T.out-TP.out)/TP.out; sentences.push(Math.abs(d)<0.03?'You spent about the same as last month.':`You spent <b>${pct(Math.abs(d))} ${d>0?'more':'less'}</b> than in ${monShort(prev)}.`); }
  if(rate!==null) sentences.push(rate>=0?`You kept <b>${pct(rate)}</b> of your income (${money(T.kept)}).`:`You spent <b>${money(-T.kept)} more</b> than you earned.`);
  const over=catsOf('Spending').filter(c=>c.budget&&spentIn(m,c.name)>c.budget).map(c=>c.name);
  let tipTxt= over.length?`Tip: ${esc(over[0])} went over its limit — raise the limit in Plan or aim lower next month.`
    : rate!==null&&rate<0.1?'Tip: try to keep at least 10% of your income. Start with one small cut in your biggest category.'
    : rate!==null&&rate>=0.2?'Nice work — you\'re keeping 20% or more. Consider a savings goal in Goals.' : 'Tip: set a monthly limit on your biggest category to stay in control.';
  h+=`<div class="card summary"><h3>${monthName(m)} in short</h3>${sentences.map(s=>`<p>${s}</p>`).join('')}<p style="color:var(--green)">${tipTxt}</p></div>`;
  // KPIs
  h+=`<div class="card"><div class="stats" style="margin:0"><div class="stat"><span class="label">In</span><b>${money(T.inc)}</b></div><div class="stat"><span class="label">Out</span><b>${money(T.out)}</b></div><div class="stat"><span class="label">Kept ${tip('rate')}</span><b style="color:${T.kept<0?'var(--red)':'var(--green)'}">${rate===null?'—':pct(rate)}</b></div></div></div>`;
  // donut
  if(total>0) h+=`<div class="card"><h3>Where your money went</h3><div class="donut">${donutSvg(parts,total)}<div class="legend">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${esc(p.n)}</span><b>${pct(p.v/total)}</b></div>`).join('')}</div></div></div>`;
  // movers
  const names=[...new Set(Object.keys(by).concat(Object.keys(byP)))];
  const movers=names.map(n=>({n,a:by[n]||0,b:byP[n]||0,d:(by[n]||0)-(byP[n]||0)})).filter(x=>Math.abs(x.d)>=1).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5);
  if(movers.length&&TP.out>0) h+=`<div class="card"><h3>Compared with ${monShort(prev)}</h3>`+movers.map(x=>`<div class="mover"><span>${icon({name:x.n,group:groupOf(x.n)||''})} ${esc(x.n)}</span><span style="color:${x.d>0?'var(--red)':'var(--green)'};font-weight:600">${x.d>0?'▲ +':'▼ −'}${money(Math.abs(x.d))}${x.b?' ('+(x.d>0?'+':'−')+pct(Math.abs(x.d)/x.b)+')':''}</span></div>`).join('')+`</div>`;
  // 50/30/20 or method check
  // trend
  const months=Array.from({length:12},(_,i)=>shiftMonth(m,i-11)).filter(x=>x>=ym((S.plan.created||todayStr()))||S.tx.some(t=>ym(t.date)===x));
  const tr=months.map(x=>Object.assign({m:x},monthTotals(x))); const mx=Math.max(1,...tr.map(x=>Math.max(x.inc,x.out)));
  if(tr.length>=2) h+=`<div class="card"><div class="line1"><h3>Month by month</h3><span class="right"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#16946B"></i> in &nbsp;<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#F0997B"></i> out</span></div>
    <div class="trend">${tr.map(x=>`<div class="m"><div class="bars"><i style="height:${x.inc/mx*100}%;background:#16946B"></i><i style="height:${x.out/mx*100}%;background:#F0997B"></i></div><small>${monShort(x.m)}</small></div>`).join('')}</div></div>`;
  // year table
  const yr=m.slice(0,4), ms=Array.from({length:12},(_,i)=>yr+'-'+pad(i+1)).filter(x=>S.tx.some(t=>ym(t.date)===x));
  if(ms.length){ let ti=0,to=0; h+=`<div class="card"><h3>${yr} so far</h3><table class="ytable"><tr><th>Month</th><th>In</th><th>Out</th><th>Kept</th></tr>`+
    ms.map(x=>{ const t=monthTotals(x); ti+=t.inc; to+=t.out; return `<tr><td>${monShort(x)}</td><td>${money(t.inc)}</td><td>${money(t.out)}</td><td style="color:${t.kept<0?'var(--red)':'var(--green)'}">${money(t.kept)}</td></tr>`; }).join('')+
    `<tr><td><b>Total</b></td><td><b>${money(ti)}</b></td><td><b>${money(to)}</b></td><td style="color:${ti-to<0?'var(--red)':'var(--green)'}"><b>${money(ti-to)}</b></td></tr></table></div>`; }
  // entries
  const list=S.tx.filter(t=>ym(t.date)===m).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  h+=`<div class="card" id="entries"><div class="line1"><h3>All entries · ${list.length}</h3></div>${(showAllTx?list:list.slice(0,8)).map(txRow).join('')}${list.length>8&&!showAllTx?`<button class="linkbtn" data-act="moretx">Show all ${list.length} ›</button>`:''}<p class="sub" style="margin:8px 0 0">Tap an entry to edit or delete it.</p></div>`;
  $('app').innerHTML=h;
}

/* ---------- PLAN ---------- */
const METHODS={own:{name:'My own plan'},r503020:{name:'50/30/20',t:[50,30,20]},r702010:{name:'70/20/10',t:[70,20,10]},r602020:{name:'60/20/20',t:[60,20,20]},zero:{name:'Zero-based'}};
const NEED_RX=/grocer|transport|fuel|health|pharm|doctor|medic|child|kid|school|insur|util|rent|mortgage/i;
function bucket(c){ if(!c||c.group==='Income') return null; if(c.group==='Bills') return 'need'; if(c.group==='Savings'||c.group==='Debt') return 'save'; return c.type?(c.type==='Need'?'need':'want'):(NEED_RX.test(c.name)?'need':'want'); }
function splitOf(fn){ const o={need:0,want:0,save:0}; fn(o); return o; }
function ruleBars(split,inc,t,word){
  const L=[['need','Needs','#378ADD'],['want','Wants','#D4537E'],['save','Savings & debt','#16946B']];
  return `<div style="text-align:left;margin-top:14px">`+L.map(([k,lab,col],i)=>{ const p=inc?Math.round(split[k]/inc*100):0, bad=k==='save'?p<t[i]:p>t[i];
    return `<div style="margin-bottom:8px"><div class="line1"><span style="font-size:13px">${lab}</span><span class="right">${p}% <span style="color:${bad?'var(--amber)':'var(--green)'}">/ ${t[i]}% ${bad?(k==='save'?'↓':'↑'):'✓'}</span></span></div><div class="meter"><i style="display:block;width:${Math.min(p,100)}%;background:${col}"></i></div></div>`; }).join('')+`<div class="sub">${word} vs. income of ${money(inc)}</div></div>`;
}
const rf={open:false,kind:'out',name:'',amt:'',freq:'monthly',day:+todayStr().slice(8,10),date:todayStr()};
function renderPlan(){
  const inc=planned('Income'), outp=planned('Bills')+planned('Spending')+planned('Savings')+planned('Debt');

    ${meth==='zero'?`<div class="payday" style="${Math.round(inc-outp)===0?'':'background:var(--amber-bg);color:var(--amber)'}">${Math.round(inc-outp)===0?'✓ Every '+esc(cur())+' has a job':(inc-outp>0?'Give the last '+money(inc-outp)+' a job':'You planned '+money(outp-inc)+' more than you earn')}</div>`:''}

  h+=`</div>`;
  // groups

      } else h+=`<div class="row"><input class="name-in" data-i="${i}" data-f="name" value="${esc(c.name)}" aria-label="Name"><input class="amt-in" inputmode="decimal" data-i="${i}" data-f="budget" value="${c.budget||''}" placeholder="0" aria-label="Amount per month"><button class="rm" data-rm="${i}" aria-label="Remove">✕</button></div>`;

const CHALLENGES={w52:'52-week challenge',w52r:'52-week challenge (reverse)',env100:'100 envelope challenge',p26:'26-paycheck challenge',nospend:'No-spend month'};
function chTotal(c){ const st=+c.step||1; if(c.type==='env100') return 5050*st; if(c.type==='p26') return 351*st; return 1378*st; }
function chCells(c){ const st=+c.step||1, n=c.type==='env100'?100:c.type==='p26'?26:52; return Array.from({length:n},(_,i)=>({k:i+1,amt:(c.type==='w52r'?n-i:i+1)*st})); }
function debtPlan(){
  const method=S.plan.debtMethod||'snowball', extra=+S.plan.extra||0;
  const order=catsOf('Debt').filter(c=>+c.balance>0).map(c=>({name:c.name,bal:+c.balance,apr:(+c.apr||0)/100,min:+c.budget||0})).sort((a,b)=>method==='snowball'?a.bal-b.bal:(b.apr-a.apr)||(a.bal-b.bal));
  const total=order.reduce((a,d)=>a+d.min,0)+extra; let m=0,interest=0; const done={};
  while(order.some(d=>d.bal>0)&&m<600){ m++;
    order.forEach(d=>{ if(d.bal>0){ const i=d.bal*d.apr/12; interest+=i; d.bal+=i; } });
    let pool=total; order.forEach(d=>{ if(d.bal>0){ const p=Math.min(d.min,d.bal,pool); d.bal-=p; pool-=p; } });
    for(const d of order){ if(d.bal>0&&pool>0){ const p=Math.min(pool,d.bal); d.bal-=p; pool-=p; } }
    order.forEach(d=>{ if(d.bal<=0.005&&!done[d.name]){ d.bal=0; done[d.name]=m; } }); }
  return {order:order.map(d=>d.name),done,months:m,interest,stuck:m>=600};
}

const add={amt:'',cat:null,kind:'out',date:null,rep:'once',edit:null};
function freqUsed(kind){ const since=addDays(todayStr(),-90), cnt={};
  S.tx.forEach(t=>{ if(t.date>=since&&!t.auto){ const g=groupOf(t.cat); if(g&&((kind==='in')===(g==='Income'))) cnt[t.cat]=(cnt[t.cat]||0)+1; } });
  const pool=cats().filter(c=>(kind==='in')===(c.group==='Income')).map(c=>c.name);
  return pool.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||(groupOf(a)==='Spending'?-1:0)-(groupOf(b)==='Spending'?-1:0)).slice(0,6);
}
function openAdd(cat,kind,editId){
  add.edit=editId||null; add.rep='once';
  if(editId){ const t=S.tx.find(x=>x.id===editId); if(!t) return; add.amt=String(t.amt); add.cat=t.cat; add.kind=groupOf(t.cat)==='Income'?'in':'out'; add.date=t.date; $('note').value=t.note||''; $('note').style.display=t.note?'block':'none'; }
  else { add.amt=''; add.cat=cat||null; add.kind=cat?(groupOf(cat)==='Income'?'in':'out'):(kind||'out'); add.date=todayStr(); $('note').value=''; $('note').style.display='none';
    if(cat){ const c=catByName(cat); if(c&&c.budget&&c.group!=='Spending') add.amt=String(c.budget); } }
  $('date').value=add.date; $('rep').value='once'; $('newcat').classList.remove('open');
  updAdd(); $('sheet').classList.add('open');
}
function closeAdd(){ $('sheet').classList.remove('open'); }

  $('amount').innerHTML=`<small>${esc(cur())}</small>${esc(add.amt||'0')}`;
  $('dateLbl').textContent=add.date===todayStr()?'Today':fmtDay(add.date);
  $('repLbl').textContent=FREQ[add.rep]; $('repChip').classList.toggle('on',add.rep!=='once'); $('repChip').style.display=add.edit?'none':'';
  document.querySelectorAll('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.kind===add.kind));

  const groups=add.kind==='in'?['Income']:['Spending','Bills','Savings','Debt'];

  $('err').textContent=''; $('save').disabled=!(num(add.amt)>0&&add.cat);
  $('save').textContent=add.edit?'Save changes':(add.rep==='once'?'Save':'Save · '+FREQ[add.rep].toLowerCase());

}
function key(k){
  if(k==='⌫') add.amt=add.amt.slice(0,-1);
  else if(k==='.'){ if(add.amt.indexOf('.')<0) add.amt=(add.amt||'0')+'.'; }
  else { const dec=add.amt.split('.')[1]; if((dec&&dec.length>=2)||add.amt.replace('.','').length>=7) return; add.amt=(add.amt==='0'?'':add.amt)+k; }
  updAdd();
}
function save(){
  const v=num(add.amt);
  if(!(v>0)){ $('err').textContent='Enter an amount'; return; }
  if(!add.cat){ $('err').textContent='Pick a category'; return; }
  const note=$('note').value.trim(); closeAdd(); month=ym(add.date);
  if(add.edit){ const t=S.tx.find(x=>x.id===add.edit); if(t){ Object.assign(t,{amt:v,cat:add.cat,date:add.date,note}); lsSave(); } render(); toast('Saved ✓',false); return; }
  if(add.rep==='once'){ lastAdded=storeAdd({date:add.date,cat:add.cat,amt:v,note}); render(); toast(money(v,2)+' · '+add.cat,true); return; }
  S.plan.rules=rules().filter(r=>r.cat!==add.cat).concat([{id:uid8(),cat:add.cat,amt:v,freq:add.rep,start:add.date,note,skip:[]}]);
  syncIncomeBudget(add.cat); storePlan(); lastAdded=null; const n=runRules(); render();
  toast(n?'🔁 '+add.cat+' added and will repeat':'🔁 '+add.cat+' starts '+fmtDay(add.date),false);
}

function rfRead(){ if(!$('rfAmt')) return; rf.name=comboVal('rfName'); rf.amt=$('rfAmt').value; rf.freq=$('rfFreq').value; if($('rfDay')) rf.day=+$('rfDay').value; if($('rfDate')) rf.date=$('rfDate').value||todayStr(); }
function rfAdd(){
  rfRead(); const nm=(rf.name||'').trim(), v=num(rf.amt);
  if(!nm||!(v>0)){ $('rfErr').textContent='Pick what it is and enter an amount'; return; }
  if(ruleFor(nm)){ $('rfErr').textContent=nm+' already repeats'; return; }
  const mo=rf.freq==='monthly'||rf.freq==='twice', m=ym(todayStr()), start=mo?m+'-'+pad(Math.min(rf.day,daysIn(m))):rf.date;
  const known=catByName(nm), sug=SUGGEST_BILLS.find(x=>x[0]===nm), group=known?known.group:(rf.kind==='in'?'Income':(sug?sug[1]:'Bills'));
  if(!known) S.plan.cats.push({name:nm,group,budget:Math.round(v*PER_MONTH[rf.freq]),due:mo&&group!=='Income'?rf.day:null});
  else { if(!known.budget) known.budget=Math.round(v*PER_MONTH[rf.freq]); if(mo&&group==='Bills') known.due=rf.day; }
  const rule={id:uid8(),cat:nm,amt:v,freq:rf.freq,start,note:'',skip:[]};
  occurrences(rule,todayStr()).forEach(d=>{ if(S.tx.some(t=>t.cat===nm&&ym(t.date)===ym(d)&&!t.auto)) rule.skip.push(d); });
  S.plan.rules=rules().concat([rule]); syncIncomeBudget(nm); S.plan.cats.sort((a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group)); storePlan();
  Object.assign(rf,{open:false,name:'',amt:''}); runRules(); renderPlan(); toast('🔁 '+nm+' added',false);
}

    resetArm=false; S.plan=null; S.tx=[]; lsSave(); Object.assign(ob,{step:1,salary:'',extras:[],bills:{},ownBills:[],ownSpend:[],save:''}); view='home'; render(); return; }
  // plan
  if(d.act==='rfopen'){ rf.open=true; renderPlan(); return; }
  if(d.act==='rfcancel'){ rf.open=false; renderPlan(); return; }
  if(d.act==='rfadd') return rfAdd();
  if(d.rfkind){ rfRead(); rf.kind=d.rfkind; rf.name=''; renderPlan(); return; }
  if(d.rm!==undefined){ const c=S.plan.cats[+d.rm], used=c?S.tx.filter(x=>x.cat===c.name).length:0;
    if(used&&rmArm!==c.name){ rmArm=c.name; toast('Tap ✕ again to remove. '+used+' entries stay in Insights.',false); setTimeout(()=>{ if(rmArm===c.name) rmArm=null; },4000); return; }
    rmArm=null; S.plan.rules=rules().filter(r=>!c||r.cat!==c.name); S.plan.cats.splice(+d.rm,1); storePlan(); renderPlan(); return; }
  if(d.rrm!==undefined){ S.plan.rules=rules().filter((r,i)=>i!==+d.rrm); storePlan(); renderPlan(); toast('Stopped repeating. Past entries stay.',false); return; }
  if(d.addcat){ S.plan.cats.push({name:'',group:d.addcat,budget:0,due:null}); S.plan.cats.sort((a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group)); renderPlan();
    const el=[...document.querySelectorAll('.name-in')].find(x=>!x.value); if(el) el.focus(); return; }
  // goals
  if(d.tick){ const [ci,k]=d.tick.split(':').map(Number), c=S.plan.challenges[ci]; c.ticks=c.ticks||[]; const j=c.ticks.indexOf(k); if(j>=0) c.ticks.splice(j,1); else c.ticks.push(k); storePlan(); const y=window.scrollY; renderGoals(); window.scrollTo(0,y); return; }
  if(d.chrm!==undefined){ S.plan.challenges.splice(+d.chrm,1); storePlan(); renderGoals(); return; }
  if(d.act==='chadd'){ S.plan.challenges=(S.plan.challenges||[]).concat([{type:$('chType').value,step:+$('chStep').value,ticks:[]}]); storePlan(); renderGoals(); toast('Challenge started 💪',false); return; }
});
document.addEventListener('change',e=>{
  const el=e.target, d=el.dataset;
  if(d.combo){ const o=$(d.combo+'Own'); if(o){ o.style.display=el.value===OWN?'':'none'; if(el.value===OWN) o.focus(); } return; }
  // setup checkboxes
  if(d.obbill!==undefined){ obRead(); (ob.bills[d.obbill]=ob.bills[d.obbill]||{}).on=el.checked; const y=window.scrollY; renderWelcome(); window.scrollTo(0,y); if(el.checked){ const a=document.querySelector(`[data-obbamt="${CSS.escape(d.obbill)}"]`); if(a) a.focus(); } return; }
  if(d.obsp!==undefined){ obRead(); (ob.spend[d.obsp]=ob.spend[d.obsp]||{}).on=el.checked; const y=window.scrollY; renderWelcome(); window.scrollTo(0,y); return; }
  if(el.id==='obCur'){ ob.cur=el.value; return; }
  if(el.id==='allcats'){ if(el.value===OWN){ $('newcat').classList.add('open'); $('newcatName').focus(); } else if(el.value){ add.cat=el.value; updAdd(); } return; }
  if(el.id==='method'){ S.plan.method=el.value; storePlan(); renderPlan(); return; }
  if(el.id==='cur2'){ S.plan.currency=el.value; storePlan(); renderMore(); return; }
  if(el.id==='rfFreq'){ rfRead(); renderPlan(); return; }
  if(el.id==='dmethod'){ S.plan.debtMethod=el.value; storePlan(); renderGoals(); return; }
  if(el.id==='dextra'){ S.plan.extra=num(el.value); storePlan(); renderGoals(); return; }
  if(el.id==='restore'&&el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j||!j.plan||!Array.isArray(j.tx)) throw 0; S.plan=j.plan; S.tx=j.tx; lsSave(); view='home'; render(); toast('Backup restored ✓',false); }catch(err){ toast('That file isn\'t a Budget backup',false); } }; r.readAsText(el.files[0]); return; }
  if(d.g){ const c=S.plan.cats[+d.i]; if(!c) return; c[d.g]=d.g==='tdate'?el.value:num(el.value); storePlan(); const y=window.scrollY; renderGoals(); window.scrollTo(0,y); return; }
  if(d.rf){ const r=rules()[+d.ri]; if(!r) return;
    if(d.rf==='amt'){ r.amt=num(el.value); const c=catByName(r.cat); if(c&&c.group!=='Income'&&c.group!=='Spending') c.budget=r.amt; }
    if(d.rf==='freq') r.freq=el.value;
    if(d.rf==='day'){ const dd=+el.value, m=ym(r.start); r.start=m+'-'+pad(Math.min(dd,daysIn(m))); const c=catByName(r.cat); if(c&&c.group!=='Income') c.due=dd; }
    if(d.rf==='start'&&el.value) r.start=el.value;
    syncIncomeBudget(r.cat); storePlan(); runRules(); renderPlan(); return; }
  if(d.f!==undefined){ const i=+d.i, c=S.plan.cats[i]; if(!c) return;
    if(d.f==='name'){ const v=el.value.trim(); if(v&&cats().some((x,j)=>x.name===v&&j!==i)){ toast('That name is already used',false); el.value=c.name; return; }
      const old=c.name; rules().forEach(r=>{ if(r.cat===old) r.cat=v; }); c.name=v;
      if(old&&v&&old!==v){ const moved=S.tx.filter(t=>t.cat===old); moved.forEach(t=>t.cat=v); if(moved.length) toast(moved.length+' entries moved to '+v,false); } }
    if(d.f==='type') c.type=el.value;
    if(d.f==='budget'){ c.budget=Math.max(0,num(el.value)); const r=ruleFor(c.name); if(r&&c.group!=='Income'&&c.group!=='Spending') r.amt=c.budget; }
    if(d.f==='due'){ const n=parseInt(el.value,10); c.due=n>=1&&n<=31?n:null; const r=ruleFor(c.name); if(r&&c.due) r.start=ym(r.start)+'-'+pad(Math.min(c.due,daysIn(ym(r.start)))); }
    if(d.f==='auto'){ if(el.value==='yes'){ if(!c.name||!c.budget){ toast('Add a name and amount first',false); el.value='no'; return; }
        const m=ym(todayStr()), day=c.due?pad(Math.min(c.due,daysIn(m))):pad(+todayStr().slice(8,10));
        const rule={id:uid8(),cat:c.name,amt:c.budget,freq:'monthly',start:m+'-'+day,note:'',skip:[]};
        occurrences(rule,todayStr()).forEach(dd=>{ if(S.tx.some(t=>t.cat===c.name&&ym(t.date)===ym(dd)&&!t.auto)) rule.skip.push(dd); });
        S.plan.rules=rules().filter(r=>r.cat!==c.name).concat([rule]); toast('🔁 '+c.name+' will be added every month',false); }
      else S.plan.rules=rules().filter(r=>r.cat!==c.name); }
    S.plan.cats=S.plan.cats.filter((x,j)=>x.name||j===i); storePlan(); runRules(); renderPlan(); return; }
});
$('rep').onchange=function(){ add.rep=this.value; updAdd(); };
$('newcatAdd').onclick=()=>{ const nm=$('newcatName').value.trim(); if(!nm) return; if(catByName(nm)){ $('err').textContent='That name is already used'; return; }
  const g=add.kind==='in'?'Income':'Spending'; S.plan.cats.push({name:nm,group:g,budget:0,due:null}); S.plan.cats.sort((a,b)=>GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group)); storePlan(); add.cat=nm; $('newcatName').value=''; $('newcat').classList.remove('open'); updAdd(); };
$('fab').onclick=()=>{ if(S.plan) openAdd(); };
$('close').onclick=closeAdd;
$('save').onclick=save;
$('del').onclick=()=>{ if(!add.edit) return; const id=add.edit; closeAdd(); storeDel(id); render(); toast('Deleted',false); };
$('date').onchange=function(){ if(this.value){ add.date=this.value; updAdd(); } };
$('noteBtn').onclick=()=>{ const n=$('note'); n.style.display=n.style.display==='none'?'block':'none'; if(n.style.display==='block') n.focus(); };
$('undo').onclick=()=>{ $('toast').classList.remove('show'); if(lastAdded){ storeDel(lastAdded); lastAdded=null; render(); } };

/* ---------- start ---------- */
(function init(){
  const j=lsLoad(); S.plan=j.plan; S.tx=j.tx||[];
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(S.plan) runRules();
  render();
  if(S.plan&&!S.plan.tourDone){ tourStep=0; showTour(); }
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
